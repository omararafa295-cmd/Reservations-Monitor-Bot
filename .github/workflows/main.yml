name: Monitor Bot
on:
  schedule:
    - cron: '*/15 * * * *' # هيشتغل كل 15 دقيقة
  workflow_dispatch: # زرار للتشغيل اليدوي لو حبيت تختبره

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        run: python monitor.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add sent.txt
          git commit -m "Update sent items" || echo "No changes to commit"
          git push
